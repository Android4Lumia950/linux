%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/lattice,uc120.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lattice UC120 USB Type-C CC / PD PHY (iCE5LP2K)

maintainers:
  - linux-arm-msm@vger.kernel.org

description: |
  The Lattice UC120 is an iCE5LP2K FPGA factory-programmed as the USB-C
  Configuration Channel PHY on Microsoft MSM8992/MSM8994 Octagon (Lumia
  950 / 950 XL). Communication is a proprietary register protocol over SPI.

properties:
  compatible:
    const: lattice,uc120

  reg:
    maxItems: 1

  spi-max-frequency: true

  interrupts:
    maxItems: 1

  usb-psy-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Name of the USB charger power_supply to receive Type-C
      advertised current via POWER_SUPPLY_PROP_CURRENT_MAX.

  orientation-gpios:
    maxItems: 1
    description: SuperSpeed polarity (HD3SS460 AMSEL/SS_POL). High is
      reverse orientation (ACPI Register 7 polarity bit).

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

    properties:
      compatible:
        const: usb-c-connector

    required:
      - pd-disable

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@0 {
            compatible = "lattice,uc120";
            reg = <0>;
            spi-max-frequency = <5000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <95 IRQ_TYPE_EDGE_FALLING>;
            usb-psy-name = "qcom-smbchg-usb";
            orientation-gpios = <&pmi_gpios 8 GPIO_ACTIVE_HIGH>;

            connector {
                compatible = "usb-c-connector";
                label = "USB-C";
                power-role = "dual";
                try-power-role = "sink";
                data-role = "dual";
                typec-power-opmode = "default";
                pd-disable;
            };
        };
    };
